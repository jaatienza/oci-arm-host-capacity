name: Oracle Free Instance Hunter (Python Stable)

on:
  workflow_dispatch: 
  schedule:
    - cron: '*/30 * * * *' 

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install oci dotenv python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generar Clave de API Temporal
        env:
          KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          echo "$KEY_CONTENT" > /home/runner/oracle_api_key.pem
          chmod 600 /home/runner/oracle_api_key.pem

      - name: Ejecutar Cazador Python
        env:
          # Variables nativas del SDK de Oracle que sí pasaban el login antes
          OCI_REGION: eu-madrid-1
          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /home/runner/oracle_api_key.pem
          
          # Configuración de tu máquina de 2 OCPUs y 12 GB en Madrid 3
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_ID: ocid1.image.oc1.eu-madrid-1.aaaaaaaamyw57x3m6m7bcywsmwmdwun2eclixshmptf2h3c6g66bcoofm76a
          OCI_AVAILABILITY_DOMAIN: tsLF:EU-MADRID-3-AD-1
          
          OCI_OCPUS: 2
          OCI_MEMORY_IN_GBS: 12
          OCI_SHAPE: VM.Standard.A1.Flex
          OCI_MAX_INSTANCES: 1
          OCI_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          # Arrancamos el script principal de Python
          python index.py
